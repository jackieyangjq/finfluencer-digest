name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,portfolio]"
      - run: ruff check .
      - run: pytest -q
      - run: finfluencer-digest --demo --out /tmp/demo >/dev/null && test -s /tmp/demo/2026-09-23.md
