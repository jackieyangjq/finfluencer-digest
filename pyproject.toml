[project]
name = "finfluencer-digest"
version = "1.0.0"
description = "Daily digest of finance YouTubers and X accounts: Gemini watches the videos, extracts structured stock calls, aggregates consensus, and emails you."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["google-genai>=2.25", "pyyaml", "markdown", "python-dotenv", "pydantic>=2"]

[project.optional-dependencies]
portfolio = ["pandas", "yfinance", "longbridge"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
finfluencer-digest = "finfluencer_digest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finfluencer_digest"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
